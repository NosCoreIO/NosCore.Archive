name: .NET

on:
  push:
    branches: [ master ]
  create:
    tags:
      - '*.*.*'
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 11
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'
      continue-on-error: true
    - name: Fallback - Install .NET 11 manually
      if: failure()
      run: |
        wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --channel 11.0 --install-dir $HOME/.dotnet
        echo "$HOME/.dotnet" >> $GITHUB_PATH

    - name: Check Tag
      id: check-tag
      run: |
        if [[ v${{ github.event.ref }} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "match=true" >> $GITHUB_OUTPUT
        fi

    - name: Run Unit Tests
      run: |
        dotnet restore
        dotnet build
        dotnet test --no-build --filter TestCategory!=OPTIONAL-TEST

    - name: NuGet login
      if: steps.check-tag.outputs.match == 'true'
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: 0Lucifer0

    - name: Build Artifact
      if: steps.check-tag.outputs.match == 'true'
      id: build_artifact
      run: |
        dotnet restore
        dotnet build -c Release
        dotnet pack -c Release -o /tmp/nupkgs -v m -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:PackageVersion=${{github.event.ref}}
        dotnet nuget push /tmp/nupkgs/NosCore.Archive.${{github.event.ref}}.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        echo "ARTIFACT_PATH=/tmp/nupkgs/NosCore.Archive.${{github.event.ref}}.nupkg" >> $GITHUB_OUTPUT
        echo "ARTIFACT_NAME=NosCore.Archive.${{github.event.ref}}.nupkg" >> $GITHUB_OUTPUT

    - name: Upload Release Asset
      if: steps.check-tag.outputs.match == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: ${{ steps.build_artifact.outputs.ARTIFACT_PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
